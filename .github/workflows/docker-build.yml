name: Build & Push Docker Image

on:
  push:
    branches:
      - main   # ganti jika branch utama kamu berbeda (e.g. master)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # contoh: username/annafilah

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # diperlukan untuk push ke ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from GitHub Secret
        # Gunakan env: agar newline tidak hilang (echo inline tidak preserve newline)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s' "$ENV_FILE" > .env

      - name: Verify .env created (debug)
        run: |
          echo "=== .env line count ==="
          wc -l .env
          echo "=== Keys in .env (values hidden) ==="
          grep -v '^#' .env | grep '=' | cut -d'=' -f1 || echo "(empty)"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
